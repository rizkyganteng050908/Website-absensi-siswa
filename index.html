
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Informasi Absensi Siswa</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#123c69;color:white;padding:20px}
header h1{margin:0;font-size:23px}
header p{margin:7px 0 0;color:#dbeafe}
.container{max-width:1150px;margin:25px auto;padding:0 16px}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #0000000b}
.login{max-width:420px;margin:60px auto}
input,select,button{padding:11px;border-radius:7px;border:1px solid #cbd5e1;font-size:14px}
input,select{width:100%;margin:7px 0 13px}
button{background:#2563eb;color:white;border:0;cursor:pointer;margin:3px}
button:hover{background:#1d4ed8}
button.secondary{background:#475569}
button.danger{background:#dc2626}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
nav button{background:#dbeafe;color:#1e40af}
nav button.active{background:#123c69;color:white}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:18px;border-radius:10px;background:#eff6ff}
.stat strong{display:block;font-size:26px;margin-top:8px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#eff6ff}
.table-wrap{overflow-x:auto}
.hidden{display:none!important}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.message{color:#dc2626;font-size:14px}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>

<header>
  <h1>📘 Sistem Informasi Absensi Siswa</h1>
  <p>Pengelolaan kehadiran siswa berbasis web</p>
</header>

<div class="container">

<section id="loginPage" class="card login">
  <h2>Login Sistem</h2>
  <p>Silakan masuk sesuai akun demo.</p>
  <form id="loginForm">
    <label>Username</label>
    <input id="username" required placeholder="Masukkan username">
    <label>Password</label>
    <input id="password" type="password" required placeholder="Masukkan password">
    <button type="submit">Login</button>
  </form>
  <p class="message" id="loginError"></p>
  <hr>
  <small>
    Admin: admin / Admin123!<br>
    Guru: guru / Guru123!<br>
    Siswa: siswa / Siswa123!
  </small>
</section>

<section id="appPage" class="hidden">
  <div class="card">
    <strong id="welcome"></strong>
    <button class="danger" onclick="logout()" style="float:right">Logout</button>
  </div>

  <nav id="navigation">
    <button data-page="dashboard" class="active">Dashboard</button>
    <button data-page="siswa">Data Siswa</button>
    <button data-page="kelas">Data Kelas</button>
    <button data-page="presensi">Input Presensi</button>
    <button data-page="riwayat">Riwayat</button>
    <button data-page="izin">Pengajuan Izin</button>
    <button data-page="laporan">Laporan</button>
  </nav>

  <main id="content"></main>
</section>
</div>

<footer>Sistem Informasi Absensi Siswa · Versi demo tanpa database</footer>

<script>
const akun = {
  admin:{password:"Admin123!",nama:"Administrator",role:"admin"},
  guru:{password:"Guru123!",nama:"Guru / Wali Kelas",role:"guru"},
  siswa:{password:"Siswa123!",nama:"Siswa",role:"siswa"}
};

let currentUser = null;

function loadData(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){ return fallback; }
}

let siswa = loadData("abs_siswa",[
  {id:1,nama:"Andi Saputra",nis:"1001",kelas:"X RPL 3"},
  {id:2,nama:"Siti Aulia",nis:"1002",kelas:"X RPL 3"},
  {id:3,nama:"Budi Santoso",nis:"1003",kelas:"XI RPL 3"}
]);

let kelas = loadData("abs_kelas",["X RPL 3","XI RPL 3","XII RPL 3"]);
let presensi = loadData("abs_presensi",[]);
let izin = loadData("abs_izin",[]);

function saveData(){
  localStorage.setItem("abs_siswa",JSON.stringify(siswa));
  localStorage.setItem("abs_kelas",JSON.stringify(kelas));
  localStorage.setItem("abs_presensi",JSON.stringify(presensi));
  localStorage.setItem("abs_izin",JSON.stringify(izin));
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const user = document.getElementById("username").value.trim().toLowerCase();
  const pass = document.getElementById("password").value;
  if(akun[user] && akun[user].password===pass){
    currentUser={username:user,...akun[user]};
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("appPage").classList.remove("hidden");
    document.getElementById("welcome").textContent=
      "Halo, "+currentUser.nama+" ("+currentUser.role+")";
    render("dashboard");
  }else{
    document.getElementById("loginError").textContent=
      "Username atau password salah.";
  }
});

function logout(){
  currentUser=null;
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("password").value="";
}

document.getElementById("navigation").addEventListener("click",function(e){
  if(e.target.dataset.page) render(e.target.dataset.page);
});

function render(page){
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page)
  );

  const content=document.getElementById("content");
  if(!currentUser)return;

  const adminOnly=["siswa","kelas"];
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("hidden",
      currentUser.role==="siswa" &&
      ["siswa","kelas","presensi","laporan"].includes(b.dataset.page)
    );
  });

  if(adminOnly.includes(page)&&currentUser.role!=="admin"){
    content.innerHTML="<div class='card'>Menu ini hanya tersedia untuk admin.</div>";
    return;
  }

  if(page==="dashboard"){
    const today=new Date().toISOString().slice(0,10);
    const records=presensi.filter(p=>p.tanggal===today);
    content.innerHTML=`
      <div class="card"><h2>Dashboard</h2>
      <p>Ringkasan sistem absensi siswa.</p>
      <div class="stats">
        <div class="stat">Total Siswa<strong>${siswa.length}</strong></div>
        <div class="stat">Total Kelas<strong>${kelas.length}</strong></div>
        <div class="stat">Presensi Hari Ini<strong>${records.length}</strong></div>
        <div class="stat">Pengajuan Menunggu<strong>${izin.filter(i=>i.status==="Menunggu").length}</strong></div>
      </div></div>
      <div class="card"><h3>Informasi</h3>
      <p>Gunakan menu untuk mengelola data siswa dan kehadiran.</p>
      <p>Tanggal: ${today}</p></div>`;
  }

  if(page==="siswa"){
    content.innerHTML=`
      <div class="card"><h2>Data Siswa</h2>
      <form id="studentForm">
        <div class="row">
          <div><label>Nama siswa</label><input name="nama" required></div>
          <div><label>NIS</label><input name="nis" required></div>
          <div><label>Kelas</label><select name="kelas">${kelas.map(k=>`<option>${escapeHTML(k)}</option>`).join("")}</select></div>
        </div>
        <button>Tambah Siswa</button>
      </form></div>
      <div class="card table-wrap"><table>
      <thead><tr><th>No.</th><th>Nama</th><th>NIS</th><th>Kelas</th><th>Aksi</th></tr></thead>
      <tbody>${siswa.map((s,i)=>`<tr>
        <td>${i+1}</td><td>${escapeHTML(s.nama)}</td>
        <td>${escapeHTML(s.nis)}</td><td>${escapeHTML(s.kelas)}</td>
        <td><button class="danger" onclick="hapusSiswa(${s.id})">Hapus</button></td>
      </tr>`).join("")}</tbody></table></div>`;
    document.getElementById("studentForm").onsubmit=function(e){
      e.preventDefault();
      const f=new FormData(e.target);
      siswa.push({id:Date.now(),nama:f.get("nama"),nis:f.get("nis"),kelas:f.get("kelas")});
      saveData();render("siswa");
    };
  }

  if(page==="kelas"){
    content.innerHTML=`
      <div class="card"><h2>Data Kelas</h2>
      <form id="classForm"><label>Nama kelas</label>
      <input name="kelas" required placeholder="Contoh: X RPL 3">
      <button>Tambah Kelas</button></form></div>
      <div class="card"><h3>Daftar Kelas</h3>
      ${kelas.map((k,i)=>`<p>${i+1}. ${escapeHTML(k)}
      <button class="danger" onclick="hapusKelas(${i})">Hapus</button></p>`).join("")}</div>`;
    document.getElementById("classForm").onsubmit=function(e){
      e.preventDefault();
      const name=new FormData(e.target).get("kelas").trim();
      if(!kelas.includes(name))kelas.push(name);
      saveData();render("kelas");
    };
  }

  if(page==="presensi"){
    content.innerHTML=`
      <div class="card"><h2>Input Presensi</h2>
      <form id="attendanceForm">
        <label>Tanggal</label><input name="tanggal" type="date" required value="${new Date().toISOString().slice(0,10)}">
        <label>Siswa</label><select name="siswaId">${siswa.map(s=>`<option value="${s.id}">${escapeHTML(s.nama)} — ${escapeHTML(s.kelas)}</option>`).join("")}</select>
        <label>Status Kehadiran</label>
        <select name="status"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select>
        <label>Keterangan</label><input name="keterangan" placeholder="Opsional">
        <button>Simpan Presensi</button>
      </form></div>`;
    document.getElementById("attendanceForm").onsubmit=function(e){
      e.preventDefault();
      const f=new FormData(e.target);
      const id=Number(f.get("siswaId"));
      const student=siswa.find(s=>s.id===id);
      if(!student)return alert("Tambahkan data siswa terlebih dahulu.");
      presensi=presensi.filter(p=>!(p.siswaId===id&&p.tanggal===f.get("tanggal")));
      presensi.push({id:Date.now(),siswaId:id,nama:student.nama,kelas:student.kelas,
        tanggal:f.get("tanggal"),status:f.get("status"),keterangan:f.get("keterangan")});
      saveData();alert("Presensi berhasil disimpan.");render("riwayat");
    };
  }

  if(page==="riwayat"){
    content.innerHTML=`
      <div class="card"><h2>Riwayat Kehadiran</h2>
      <label>Filter tanggal</label><input type="date" id="filterDate">
      <button onclick="renderRiwayat()">Tampilkan</button>
      <button class="secondary" onclick="render('riwayat')">Semua Tanggal</button></div>
      <div class="card table-wrap" id="historyTable"></div>`;
    renderRiwayat();
  }

  if(page==="izin"){
    content.innerHTML=`
      <div class="card"><h2>Pengajuan Izin / Sakit</h2>
      <form id="leaveForm">
        <label>Nama siswa</label><select name="siswaId">${siswa.map(s=>`<option value="${s.id}">${escapeHTML(s.nama)}</option>`).join("")}</select>
        <label>Tanggal</label><input name="tanggal" type="date" required value="${new Date().toISOString().slice(0,10)}">
        <label>Jenis</label><select name="jenis"><option>Izin</option><option>Sakit</option></select>
        <label>Alasan</label><input name="alasan" required>
        <button>Kirim Pengajuan</button>
      </form></div>
      <div class="card"><h3>Daftar Pengajuan</h3>
      ${izin.length?izin.map(i=>`<p><b>${escapeHTML(i.nama)}</b> — ${escapeHTML(i.jenis)} (${escapeHTML(i.tanggal)})<br>
      Alasan: ${escapeHTML(i.alasan)}<br>Status: <b>${escapeHTML(i.status)}</b>
      ${i.status==="Menunggu"&&currentUser.role!=="siswa"?`
      <button onclick="ubahIzin(${i.id},'Disetujui')">Setujui</button>
      <button class="danger" onclick="ubahIzin(${i.id},'Ditolak')">Tolak</button>`:""}</p><hr>`).join(""):"Belum ada pengajuan."}</div>`;
    document.getElementById("leaveForm").onsubmit=function(e){
      e.preventDefault();
      const f=new FormData(e.target);
      const student=siswa.find(s=>s.id===Number(f.get("siswaId")));
      if(!student)return alert("Data siswa belum tersedia.");
      izin.push({id:Date.now(),siswaId:student.id,nama:student.nama,
        tanggal:f.get("tanggal"),jenis:f.get("jenis"),alasan:f.get("alasan"),status:"Menunggu"});
      saveData();render("izin");
    };
  }

  if(page==="laporan"){
    const counts={Hadir:0,Izin:0,Sakit:0,Alpa:0};
    presensi.forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
    content.innerHTML=`
      <div class="card"><h2>Laporan Absensi</h2>
      <div class="stats">${Object.entries(counts).map(([k,v])=>`<div class="stat">${k}<strong>${v}</strong></div>`).join("")}</div>
      <p>Total catatan presensi: ${presensi.length}</p>
      <button onclick="exportCSV()">Download Laporan CSV</button>
      <button class="secondary" onclick="backup()">Backup Data JSON</button>
      <label>Impor backup JSON</label><input type="file" id="importFile" accept=".json,application/json">
      <button onclick="restoreBackup()">Pulihkan Backup</button></div>`;
  }
}

function hapusSiswa(id){
  if(confirm("Hapus siswa ini?")){
    siswa=siswa.filter(s=>s.id!==id);saveData();render("siswa");
  }
}

function hapusKelas(index){
  if(confirm("Hapus kelas ini?")){
    kelas.splice(index,1);saveData();render("kelas");
  }
}

function ubahIzin(id,status){
  izin=izin.map(i=>i.id===id?{...i,status}:i);
  saveData();render("izin");
}

function renderRiwayat(){
  const el=document.getElementById("historyTable");
  if(!el)return;
  const filter=document.getElementById("filterDate")?.value;
  const data=presensi.filter(p=>
    (!filter||p.tanggal===filter)&&
    (currentUser.role!=="siswa"||p.siswaId===siswa.find(s=>s.nis===currentUser.username)?.id)
  );
  el.innerHTML=`<table><thead><tr><th>Tanggal</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Keterangan</th></tr></thead>
  <tbody>${data.map(p=>`<tr><td>${escapeHTML(p.tanggal)}</td><td>${escapeHTML(p.nama)}</td>
  <td>${escapeHTML(p.kelas)}</td><td>${escapeHTML(p.status)}</td>
  <td>${escapeHTML(p.keterangan||"-")}</td></tr>`).join("")}</tbody></table>
  ${data.length?"":"Belum ada data presensi."}`;
}

function exportCSV(){
  const rows=[["Tanggal","Nama","Kelas","Status","Keterangan"],
    ...presensi.map(p=>[p.tanggal,p.nama,p.kelas,p.status,p.keterangan||""])];
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  downloadFile(blob,"laporan-absensi.csv");
}

function backup(){
  const data={siswa,kelas,presensi,izin};
  downloadFile(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),
    "backup-absensi.json");
}

function restoreBackup(){
  const file=document.getElementById("importFile").files[0];
  if(!file)return alert("Pilih file backup JSON terlebih dahulu.");
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const d=JSON.parse(reader.result);
      if(!Array.isArray(d.siswa)||!Array.isArray(d.kelas)||
         !Array.isArray(d.presensi)||!Array.isArray(d.izin))
        throw new Error("Format backup tidak sesuai.");
      if(!confirm("Pulihkan data? Data lokal saat ini akan diganti."))return;
      siswa=d.siswa;kelas=d.kelas;presensi=d.presensi;izin=d.izin;
      saveData();alert("Backup berhasil dipulihkan.");render("dashboard");
    }catch(e){alert("File backup tidak valid.");}
  };
  reader.readAsText(file);
}

function downloadFile(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=name;a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
